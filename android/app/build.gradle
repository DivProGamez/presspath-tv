plugins {
    id 'com.android.application'
}

// The web app lives in ../../web and is copied into the APK's assets/web at build time.
def webAssets = layout.buildDirectory.dir("generated/presspath-assets")
def copyWebAssets = tasks.register('copyWebAssets', Copy) {
    from(rootProject.file('../web')) { include 'index.html', 'css/**', 'js/**' }
    into webAssets.map { it.dir('web') }
}

android {
    namespace 'com.presspath.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.presspath.tv'
        minSdk 22
        targetSdk 35
        versionCode 10000
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore/keystore.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile rootProject.file('keystore/' + props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    sourceSets {
        main { assets.srcDirs += webAssets.get().asFile }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.named('preBuild') { dependsOn copyWebAssets }
